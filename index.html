<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Chechen People’s Club</title>
<style>
* { box-sizing: border-box; }

html, body {
margin: 0; padding: 0; height: 100%;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
background: #ffffff;
}

.centered-wrapper {
display: flex; flex-direction: column;
justify-content: center; align-items: center;
height: 100vh; text-align: center; padding: 20px;
}

.logo-wrapper {
position: relative;
cursor: pointer;
width: fit-content;
}

.logo-static {
width: 250px;
height: auto;
display: block;
transition: transform 0.3s ease;
}

.logo-wrapper:hover .logo-static {
transform: scale(1.05);
}

.logo-rotating {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 340px;
height: auto;
pointer-events: none;
animation: rotateCounterClockwise 15s linear infinite;
}

@keyframes rotateCounterClockwise {
from { transform: translate(-50%, -50%) rotate(0deg); }
to { transform: translate(-50%, -50%) rotate(-360deg); }
}

.overlay {
position: fixed; top: 0; left: 0;
width: 100vw; height: 100vh;
background: rgba(0, 0, 0, 0.5);
display: flex; justify-content: center; align-items: center;
z-index: 10;
transition: opacity 0.5s ease;
opacity: 0;
pointer-events: none;
}

.overlay.active {
opacity: 1;
pointer-events: all;
}

.form-popup {
background: white; padding: 30px 25px; border-radius: 12px;
width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
opacity: 0; transform: scale(0.9);
animation: fadeInZoom 0.4s forwards;
}

@keyframes fadeInZoom {
0% { opacity: 0; transform: scale(0.9); }
100% { opacity: 1; transform: scale(1); }
}

.form-popup h3 {
margin-top: 0; font-size: 20px; margin-bottom: 20px;
text-align: center;
}

.form-popup input {
width: 100%; padding: 10px; margin-bottom: 15px;
font-size: 14px; border: 1px solid #ccc; border-radius: 6px;
}

.form-popup button {
width: 100%; padding: 12px;
background: #610000; color: white;
border: none; font-weight: bold;
font-size: 14px; cursor: pointer; border-radius: 30px;
transition: background 0.3s ease;
}

.form-popup button:hover {
background: #4d0000;
}

#successMessage {
display: none; text-align: center;
margin-top: 15px; font-size: 15px; color: black;
}

max-width: 480px {
.form-popup { width: 90%; }
.logo-static { width: 180px; }
.logo-rotating { width: 210px; }
}
</style>
</head>
<body>

<div class="centered-wrapper">
<div class="logo-wrapper" onclick="openForm()">
<img src="logo1.svg" class="logo-static" alt="Фиксированный логотип">
<img src="logo2.svg" class="logo-rotating" alt="Вращающийся логотип">
</div>
</div>

<div class="overlay" id="overlay" onclick="closeForm()">
<div class="form-popup" onclick="event.stopPropagation()">
<h3 id="formTitle">Авторизация</h3>
<form id="loginForm">
<input type="email" name="email" placeholder="Электронная почта" required />
<input type="password" name="password" placeholder="Пароль" required />
<button type="submit">Войти</button>
</form>
<div id="successMessage">Добро пожаловать!</div>
</div>
</div>

<script>
const overlay = document.getElementById("overlay");
const popup = overlay.querySelector(".form-popup");
const successMessage = document.getElementById("successMessage");
const form = document.getElementById("loginForm");
const formTitle = document.getElementById("formTitle");

// ✅ Список участников
const users = [
{ email: "admin@club.com", password: "1234" },
{ email: "user1@club.com", password: "chechen1" },
{ email: "wolf@club.com", password: "noble" }
];

function openForm() {
overlay.classList.add("active");
popup.style.animation = "none";
popup.offsetHeight;
popup.style.animation = "fadeInZoom 0.4s forwards";
}

function closeForm() {
overlay.classList.remove("active");
successMessage.style.display = "none";
form.style.display = "block";
formTitle.style.display = "block";
}

form.addEventListener("submit", function(e) {
e.preventDefault();
const email = form.email.value.trim();
const password = form.password.value;

const user = users.find(u => u.email === email && u.password === password);

if (user) {
form.reset();
form.style.display = "none";
successMessage.innerText = "Добро пожаловать, " + email;
successMessage.style.display = "block";
formTitle.style.display = "none";
} else {
alert("Неверный email или пароль.");
}
});
</script>

</body>
</html>
